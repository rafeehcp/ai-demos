services:
  - type: web
    name: ai-demos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-flash-latest
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: CORS_ORIGINS
        sync: false
